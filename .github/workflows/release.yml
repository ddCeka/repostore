name: Release
on:
  push:
    tags:
      - v*

permissions:
  contents: write
  actions: read

env:
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_PLATFORM:    "android-36"

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest
    outputs:
      build_tag: ${{ steps.version.outputs.build_tag }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}
            platform-tools
            platforms;${{ env.ANDROID_PLATFORM }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Compute version & tag
        id: version
        shell: bash
        run: |
          base_version=$(grep --only-matching --perl-regexp 'versionName\s=\s\"\K([0-9\.]+)' './app/build.gradle.kts')
          if [ -z "$base_version" ]; then
            echo "Error: Could not extract versionName from app/build.gradle.kts"
            exit 1
          fi
          tag="v${base_version}"
          echo "build_tag=$tag" >>"$GITHUB_OUTPUT"
          echo "BUILD_TAG=$tag" >>"$GITHUB_ENV"

      - run: ./gradlew assembleRelease

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > upload.jks

      - name: Zip-align
        run: |
          ${ANDROID_HOME}/build-tools/${{ env.ANDROID_BUILD_TOOLS }}/zipalign -v -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            aligned.apk

      - name: Sign with apksigner
        run: |
          ${ANDROID_HOME}/build-tools/${{ env.ANDROID_BUILD_TOOLS }}/apksigner sign \
            --ks upload.jks \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out signed.apk aligned.apk

      - name: Push git tag
        if: success()
        run: |
          git config user.email "actions@github.com"
          git config user.name  "GitHub Actions"
          git tag "$BUILD_TAG" --force
          git push origin "$BUILD_TAG" --force

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: signed.apk
          if-no-files-found: error


  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - uses: actions/download-artifact@v8
        with: { name: apk, path: dist }

      - run: ls -lh dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.build_tag }}
          name: Release ${{ needs.build.outputs.build_tag }}
          files: dist/signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
